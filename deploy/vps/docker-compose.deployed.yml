# AGE — the DEPLOYED composition (ADR-0061 A5 and A6 item 1).
#
# 🛑 THIS IS A SEPARATE NAMED COMPOSITION, NOT A MODE OF THE ROOT ONE. ADR-0061
# A5 refuses a flag, an `allowRemote` parameter and a quietly-permitting second
# function by name, "because the copy that gets relaxed still passes its own
# tests". Running this file is a deliberate act with a name; 🚫 no environment
# variable set against the root `docker-compose.yml` can select it.
#
# 🛑 A REAL CLIENT'S DATA WILL LIVE HERE, ON A SERVER THE OPERATOR DOES NOT
# PHYSICALLY HOLD. That is exactly what ADR-0055 D6 refused, the Product Owner
# made the call knowingly, and 🚫 nothing here may be read as saying otherwise.
#
# 🛑 THE HOSTED PRODUCT IS THE READ-ONLY DEMO, AND 🚫 IT IS NOT AGE STUDIO.
# ADR-0061 §5 was ANSWERED by the Product Owner on 2026-08-09 (§5-A to §5-D):
# the deployed app is `apps/web` + `apps/api`, serving the frozen, deliberately
# fictional demo profile.
# 🚫 `apps/studio` STILL gets no Dockerfile and STILL binds loopback only —
# ADR-0057 OX-INV-1 stands UNAMENDED and a test asserts the absence. Deploying
# the console would be a REVERSAL needing its own ADR and the six auth slices
# that remain uncalled. 🚫 "We deployed" must never be read as "Studio is
# deployed".
# 🚫 THIS SURFACE HOLDS NO REAL BUSINESS AND NO CLIENT DATA — the demo renders
# one fixed fixture and takes no input naming a company. It therefore needs no
# login, and 🚫 must not grow one: a login here would be the first step toward
# deploying the console by accident (§5-D).
#
# ⚠️ TLS IS TERMINATED IN FRONT, AND NOTHING BEHIND IT IS PUBLICLY REACHABLE.
# Only `edge` publishes to the world. 🚫 Do not add a `ports:` entry to any other
# service, and 🚫 do not widen one to `0.0.0.0` — a certificate in front of a
# reachable plaintext port decorates a door nobody has to use.
#
# ⚠️ EVERY SECRET IS REQUIRED AT STARTUP (A6 item 2). The `:?` form means absent
# is a REFUSAL TO START; 🚫 never `:-` — a default password is a published one.
# 🚫 No secret is committed: values come from an env file that is never tracked.

services:
  edge:
    # ⚠️ The ONLY service the world can reach. It terminates TLS and speaks
    # plaintext only on the composition's internal network.
    image: caddy:2-alpine
    container_name: age-edge
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      AGE_PUBLIC_HOST: ${AGE_PUBLIC_HOST:?the public host must be stated}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - age_deployed_caddy_data:/data
      - age_deployed_caddy_config:/config
    depends_on:
      - web
      - api

  web:
    # ⚠️ THE DEMO FRONT END. 🚫 No `ports:` — it is reachable ONLY through
    # `edge`, on the composition's internal network.
    # ⚠️ `NEXT_PUBLIC_API_URL` is a BUILD ARG, not a runtime variable: the demo
    # page is a client component, so the value is compiled into the bundle.
    # 🚫 '/api' is relative ON PURPOSE — the image carries no hostname, and the
    # browser's request never leaves the terminator to reach a plaintext port.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: age-deployed-web
    restart: unless-stopped
    depends_on:
      - api

  api:
    # ⚠️ Serves exactly two routes — `GET /health` and `GET /demo/capabilities`,
    # the latter over the frozen fixture. 🚫 No published port, and 🚫 no
    # database credential: the demo reads no database, and a credential it has
    # no use for is one a compromise inherits for free.
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: age-deployed-api
    restart: unless-stopped

  postgres:
    # ⚠️ A5 — the VPS's OWN Postgres, published to this host's loopback ONLY.
    # 🚫 Never '5432:5432': that form binds every interface on the machine.
    # ⚠️ Nothing deployed here reads it yet (§5-C); it is the store the operator
    # track will use once a slice needs it.
    image: postgres:16-alpine
    container_name: age-deployed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?the database user must be stated}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?absent at startup is a refusal}
      POSTGRES_DB: ${POSTGRES_DB:?the database name must be stated}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - age_deployed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  age_deployed_postgres_data:
  age_deployed_caddy_data:
  age_deployed_caddy_config:
