# AGE Studio — the public boundary (ADR-0074 §7 slice 4).
#
# 🛑 **THIS FILE IS THE ONLY THING BETWEEN THE INTERNET AND THE CONSOLE.**
# Everything behind it was built assuming it exists.
#
# ⚠️ **THIS IS THE HOST'S OWN nginx, WHICH ALREADY SERVES FIVE PEER VHOSTS.** An
# earlier draft made it an AGE-owned container publishing 80/443; 🚫 it could not
# exist, because those ports are taken and taking them would take five live sites
# down (ADR-0076 §0.4b). ⚠️ It has NO Docker network membership at all, so the
# public-facing component still has **no route to any database** (D4).
#
# 🛑 **THE CONSOLE NOW RUNS IN A CONTAINER** (ADR-0076 D1). It binds `0.0.0.0`
# inside its own namespace and is published on `127.0.0.1:3100` and nowhere else,
# so the upstream below is unchanged from the host-process era — OX-INV-1's
# boundary is the same host loopback it has always been, AMENDED by D2 only in
# how it is reached. ⚠️ What the container changed is OUTBOUND: the console can
# no longer open a peer's loopback-published database, which was the violation.
#
# 🛑 **THE PROXY IS NOT THE AUTHENTICATION, AND 🚫 MUST NEVER BE MADE INTO IT.**
# There is no `auth_basic` here, no allow/deny list, no IP gate. The boundary is
# the verified session inside the application (slice 2): every route but the
# sign-in door checks a session row on every request, and a logout writes
# `revoked_at`. ⚠️ A proxy-level password would be a SECOND, WEAKER answer to a
# question already answered, and the copy that gets relaxed is always the copy
# nobody is testing.
#
# ⚠️ **CLOUDFLARE FRONTS THIS HOSTNAME**, so the socket peer is an edge node.
# That has two consequences worth stating rather than rediscovering:
#   1. The certificate below must be REAL. Cloudflare on Full (strict) refuses a
#      self-signed origin certificate and answers **526** with NOTHING in this
#      box's access log — a failure that reads exactly like "DNS is wrong".
#   2. `certbot certonly --webroot` works with the orange cloud left ON, because
#      Cloudflare exempts `/.well-known/acme-challenge/` from "Always Use
#      HTTPS". 🚫 Do not grey-cloud the record to renew. That is why the
#      `.well-known` location sits ABOVE the redirect in the :80 server below.
#
# ⚠️ Modelled deliberately on the rankops vhost already on this box, so an
# operator reads ONE shape across five sites rather than five.

# ── Sign-in rate limit ────────────────────────────────────────────────────────
# 🛑 **THIS IS A TRANSPORT CONTROL, 🚫 NOT A SECOND AUTHENTICATION.** It slows an
# unbounded guessing rate against the sign-in door; it decides nothing about who
# anyone is. The boundary is still the verified session row inside the
# application, and 🚫 nothing here may ever grow into an allow-list, a password
# or an IP gate (see the header of this file).
#
# ⚠️ MEASURED BEFORE ADDING IT: 15 bad tokens submitted back to back all answered
# `303` with no throttling of any kind. The token is 32 bytes of hex, so guessing
# is not the realistic threat — the realistic threat is that an unmetered POST
# loop costs one attacker nothing and costs the console a session-store lookup
# and a constant-time hash comparison every time.
#
# 🛑 **KEYED ON `$binary_remote_addr`, WHICH IS THE VISITOR ONLY BECAUSE OF THE
# `set_real_ip_from` BLOCK IN THE SERVER BELOW.** ⚠️ MEASURED WITH AND WITHOUT
# IT: without the range-bound trust, `$remote_addr` is the Cloudflare edge node,
# 15 rapid attempts land in 15 different buckets and the limit does nothing that
# can be seen from the internet — while the same 15 straight at the origin are
# limited correctly. 🚫 A limit proven only on the path nobody uses is not a
# limit; the two paths must be checked separately, and were.
#
# ⚠️ The burst is not `nodelay`, so a person who mistypes twice is QUEUED, never
# refused: the 429 arm is reached only by concurrency no human produces.
limit_req_zone $binary_remote_addr zone=age_signin:1m rate=12r/m;

# 🚫 429, 🚫 NOT 503. A throttled caller is being told to slow down; it must not
# be told the console is down, and 🚫 it must not learn anything about whether
# the token it sent was correct — a rate limit that answered differently for a
# good token would leak exactly what #353 refused to leak.
limit_req_status 429;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name age.digitaldadi.agency;

    ssl_certificate     /etc/letsencrypt/live/age.digitaldadi.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/age.digitaldadi.agency/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Who the caller actually is ────────────────────────────────────────────
    # 🛑 **`real_ip_header` ALONE DOES NOTHING, AND THAT IS 🚫 NOT A THEORY.**
    # An earlier version of this file set `real_ip_header X-Forwarded-For;` with
    # no `set_real_ip_from`, so nginx trusted nobody and `$remote_addr` stayed
    # the Cloudflare edge node. ⚠️ MEASURED, and it mattered: the sign-in rate
    # limit below was diluted across the edge pool — 15 rapid attempts through
    # Cloudflare all passed, while the SAME 15 straight at the origin were
    # limited exactly as designed.
    #
    # 🛑 **THE TRUST IS RANGE-BOUND, WHICH IS THE WHOLE POINT.** `CF-Connecting-IP`
    # is believed ONLY when the connection itself comes from a Cloudflare range.
    # ⚠️ This origin is reachable directly by IP, and a caller who goes straight
    # at it keeps its own `$remote_addr` no matter what headers it sends — so the
    # rate-limit key is one the attacker cannot choose in either path. 🚫 Do not
    # replace this with a bare `real_ip_header CF-Connecting-IP;`: that would
    # hand every direct caller a free key rotation.
    #
    # ⚠️ Cloudflare publishes these at https://www.cloudflare.com/ips/. They move
    # rarely; a stale entry costs accuracy in the logs and dilution here, 🚫 never
    # access.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 🛑 THE CONSOLE ACCEPTS NO UPLOAD. Sources are read from a path the operator
    # names on the machine the console runs on (ADR-0054) — there is no multipart
    # route to reach. A small ceiling means a body large enough to matter is
    # refused by nginx before Next allocates anything for it.
    client_max_body_size 256k;

    # ── Security headers ──────────────────────────────────────────────────────
    # ⚠️ `always`, so they are present on ERROR responses too. Without it a 500,
    # a 405 or a 404 — the responses an attacker works hardest to provoke —
    # would come back bare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ⚠️ **`frame-ancestors 'none'` AND `form-action 'self'` ARE THE TWO THAT
    # MATTER HERE.** The first is the clickjacking answer that actually binds
    # (X-Frame-Options is the legacy echo of it); the second means a sign-in form
    # cannot be repointed at another origin by injected markup — the token is the
    # one thing on this site worth stealing.
    #
    # ⚠️ **`'unsafe-inline'` FOR SCRIPTS IS A KNOWN, RECORDED WEAKNESS, 🚫 NOT AN
    # OVERSIGHT.** Next streams its RSC payload as inline `<script>` blocks with
    # no nonce; a strict `script-src` breaks every page. Closing it needs
    # nonce-issuing middleware in `apps/studio`, which changes how requests reach
    # the session boundary and therefore needs its own slice. 🚫 Do not "fix" it
    # here by removing the token and shipping a blank console.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # 🚫 NO CORS HEADER IS SET, ANYWHERE, ON PURPOSE. The console is same-origin
    # only, and the session cookie is `SameSite=Strict`: an
    # `Access-Control-Allow-Origin` here would be the one line that makes a
    # cross-site read of an operator's console possible.

    # ── Method allow-list ─────────────────────────────────────────────────────
    # 🛑 GET, HEAD and POST ARE THE WHOLE SURFACE. Sign-in and sign-out are POST
    # route handlers; everything else is a GET page or a POST server action.
    # ⚠️ An ALLOW-LIST, 🚫 not a deny-list of the methods someone thought of:
    # TRACE, PUT, DELETE, PATCH and anything invented later are refused by
    # default rather than by enumeration.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # 🚫 THE IMAGE OPTIMIZER IS NOT PART OF THIS PRODUCT. Nothing in the console
    # imports `next/image`, so the route only ever answers 400 — but it is the
    # one built-in path that would hand an attacker-supplied URL to `sharp`
    # (HIGH, libvips CVEs, pinned by next and not separately upgradable). Denied
    # rather than argued about.
    location /_next/image {
        return 404;
    }

    # 🛑 **THE ONLY RATE-LIMITED ROUTES: THE SIGN-IN DOOR.** ⚠️ An exact-match
    # location, so it cannot silently widen to a prefix later.
    #
    # 🚫 **THE LIMIT IS NOT PUT ON `location /`.** Every authenticated page load
    # is a GET through the same key; a rate low enough to matter at the door
    # would lock a working operator out of their own console mid-session.
    #
    # ⚠️ **THE PROXY BLOCK BELOW IS REPEATED HERE ON PURPOSE — nginx locations do
    # not inherit `proxy_pass`.** 🚫 The two must not drift: an upstream changed
    # in one place and not the other would send sign-in somewhere else entirely.
    # `public-boundary.spec.ts` asserts both carry the same upstream.
    # ⚠️ **TWO EXACT-MATCH LOCATIONS SINCE ADR-0079 SLICE 3, 🚫 NOT A PREFIX.**
    # `/sign-in/start` mints the handshake; `/sign-in/callback` is the expensive
    # one — it is the only route in AGE that makes an outbound request and the
    # only one that can insert a session row. 🚫 A `location /sign-in` prefix
    # would also throttle the sign-in PAGE, which is a plain render, and the
    # regex form would silently cover routes added later without anyone
    # deciding to.
    location = /sign-in/start {
        limit_req zone=age_signin burst=5;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }

    location = /sign-in/callback {
        # burst=5 without `nodelay`: a burst is DELAYED into the rate, 🚫 not
        # rejected, so a person who mistypes twice waits and never sees a 429.
        limit_req zone=age_signin burst=5;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }

    location / {
        # 🛑 THE CONSOLE'S LOOPBACK PUBLICATION, AND 🚫 NOTHING ELSE. One
        # mistyped port here would put a PEER behind AGE's hostname and AGE's
        # certificate, with a valid padlock and no error anywhere — five other
        # products publish on this box's loopback (ADR-0076 §0.4).
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ⚠️ SET HERE, ON EVERY REQUEST, OVERWRITING WHATEVER THE CLIENT SENT.
        # 🚫 Never passed through: a client-supplied protocol is a claim, not
        # evidence, and the `__Host-` cookie's `Secure` attribute is only
        # meaningful if the origin cannot be told it is on HTTPS by the caller.
        proxy_set_header X-Forwarded-Proto https;

        # 🚫 The upstream's own `Server:`/`X-Powered-By:` are not interesting to
        # anyone but an attacker fingerprinting the framework version.
        proxy_hide_header X-Powered-By;

        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name age.digitaldadi.agency;

    # ⚠️ ABOVE THE REDIRECT, and it must stay there: certbot needs this exact
    # path reachable over plain HTTP at issuance and at every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 🛑 NOTHING ELSE IS SERVED OVER PLAINTEXT. 🚫 Not the sign-in page, not a
    # health check, not "just the static assets" — a cookie sent once over HTTP
    # is a session an observer holds.
    location / {
        return 301 https://$host$request_uri;
    }
}
