# AGE's OWN store — ADR-0075 D1–D5, accepted 2026-08-15.
#
# 🛑 THIS IS AGE'S DATABASE AND NOTHING ELSE'S. Its own container, its own named
# volume, its own network, its own lifecycle. 🚫 RankOps' container is not
# reused, 🚫 its volume is not reused, and 🚫 neither is SNARA's, Drishti's, or
# any peer's that appears later.
#
# 🛑 ADR-0075 D6 — AGE MUST NEVER SHARE A DATABASE WITH A PEER PRODUCT. Not
# RankOps today, not SNARA tomorrow. The communication architecture is
# Peer → AGE contract → AGE intelligence → AGE projection → Peer, and 🚫 NEVER
# Peer → shared database → AGE. A shared table is an integration nobody
# designed: no envelope, no version, no provenance, no refusal path — every rule
# AGE enforces at its boundary is code a `SELECT` from another product walks
# straight past.
#
# ⚠️ SO THE NETWORK BELOW IS AGE'S OWN, AND THAT IS THE POINT. 🚫 Do not attach
# this service to `rankops-internal` or to any other product's network, and
# 🚫 do not attach a peer's service to this one. D3 is meant to be a property of
# the TOPOLOGY rather than of a grant — separate instances make the reach
# impossible rather than merely ungranted, which is the difference between a
# fence and a promise.
#
# 🛑 NOT PUBLIC, AND 🚫 NOT ON 5432. The published port is bound to `127.0.0.1`
# explicitly — 🚫 never `0.0.0.0`, 🚫 never a bare `"5432:5432"`, which Docker
# publishes to the world and, worse, punches through the host firewall while
# doing it. The host port is REQUIRED and has NO DEFAULT: on this VPS 5432 is
# already SNARA's, and a defaulted port is how AGE would have ended up dialling
# another product's database while every test still passed.
#
# ⚠️ WHY A HOST PORT AT ALL — ⚠️ UPDATED 2026-08-16, ADR-0076 D1. The console is
# NO LONGER a host process; it is a container on `age-internal` and reaches this
# store over that network. The loopback publication stays for the operator's own
# HOST-side tools — `age-capture`, the relay CLI, `psql` during a migration —
# which are still processes on this box. 🚫 It is not the console's path.
#
# 🛑 AND THE ADDRESS IS PINNED, BECAUSE ADR-0061 A5 REFUSES A NAME. The console's
# `DATABASE_URL` must give an ADDRESS: judging a host name would mean resolving
# it, and a name that resolves privately today may not tomorrow. `age-postgres`
# is a Docker DNS name, so it is refused exactly like any other name — ⚠️ that
# refusal FIRED on the first containerised deployment, which is why this line
# exists. A DHCP-assigned bridge address would satisfy the guard and then move
# on the next recreate, so it is fixed here.
#
# ⚠️ THIS IS 🚫 NOT THE CASE ADR-0075 D4 REFUSES. D4 refuses reaching a PEER's
# bridge address — an address assigned by somebody else's deployment. This one is
# assigned by AGE's own compose file, on AGE's own network, to AGE's own store.
#
# ⚠️ EVERY SECRET IS REQUIRED AT STARTUP. The `:?` form means absent is a REFUSAL
# TO START; 🚫 never `:-`, because a default password is a published one. 🚫 No
# value here is committed — they come from an env file that is never tracked.
#
# ⚠️ RUN IT BY NAME. It is a separate composition, not a mode of another:
#
#     docker compose -f docker-compose.age-postgres.yml --env-file <file> up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: age-postgres
    restart: unless-stopped
    environment:
      # ⚠️ The OWNER role of AGE's own instance. It is held by a human for the
      # length of a migration and 🚫 is never written into the console's
      # environment — the console runs as the non-owner `age_app` (ADR-0075 D2).
      POSTGRES_USER: ${AGE_DB_SUPERUSER:?the superuser name must be stated}
      POSTGRES_PASSWORD: ${AGE_DB_SUPERUSER_PASSWORD:?the superuser password must be stated}
      POSTGRES_DB: ${AGE_DB_NAME:?the database name must be stated}
    # 🛑 **THERE IS NO `ports:` KEY, AND ITS ABSENCE IS THE DECISION** — ADR-0078
    # C3. AGE's store published `127.0.0.1:${AGE_DB_HOST_PORT}` until C3, because
    # the capture CLI and the migration both ran as HOST processes against it.
    # C1 moved both into containers that share this container's network
    # namespace, and C2 proved that path does real work — a scored BIF snapshot
    # written and read back under its own scope, 🚫 not merely a TCP connect.
    # With no host consumer left, the publication was reachability nobody needed.
    #
    # ⚠️ **THE HONEST CLAIM IS NARROW, 🚫 AND MUST NOT BE WIDENED** (ADR-0078 §7).
    # This store is **no longer host-published, and reachable only inside the
    # `age-internal` network by authorised AGE components.** 🚫 It is NOT
    # "unreachable": a root-equivalent account on this box can still enter a
    # namespace or `docker exec`, and that is ADR-0077's host-identity problem,
    # 🚫 not something this file can close.
    #
    # 🚫 **DO NOT ADD A PORT BACK "TEMPORARILY" TO DEBUG.** The two operations
    # that would want one already have container routes — see
    # `deploy/vps/compose/docker-compose.age-capture.yml` and
    # `docker-compose.age-migrate.yml`.
    volumes:
      # ⚠️ AGE'S OWN VOLUME (D1). A peer's restore must never be able to move an
      # AGE row, and this is what makes that true.
      - age_postgres_data:/var/lib/postgresql/data
    networks:
      age-internal:
        # 🛑 PINNED, 🚫 NOT ASSIGNED. See the header: the console names this
        # address, so it must not change when the container is recreated.
        ipv4_address: 172.23.0.2
    healthcheck:
      # ⚠️ Named explicitly: `pg_isready` with no arguments checks the image's
      # default user, which is not necessarily this one.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  age_postgres_data:
    name: age_postgres_data

networks:
  age-internal:
    name: age-internal
    ipam:
      config:
        # ⚠️ The subnet the network already has. It is written out so the pinned
        # address above is checkable against something in this repository rather
        # than against whatever Docker happened to choose on one host.
        - subnet: 172.23.0.0/16
