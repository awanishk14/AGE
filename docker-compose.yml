services:
  postgres:
    image: postgres:16-alpine
    container_name: age-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-age}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-age}
      POSTGRES_DB: ${POSTGRES_DB:-age}
    ports:
      - '5432:5432'
    volumes:
      - age_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-age}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: age-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - age_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  age_postgres_data:
  age_redis_data:
